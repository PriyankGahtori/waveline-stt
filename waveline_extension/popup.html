<!doctype html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Waveline</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="wrap">

        <!-- Header -->
        <header class="header">
            <div class="brand">
                <div class="brand-icon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                        <path d="M2 12 Q5 4 8 12 Q11 20 14 12 Q17 4 20 12 Q21 16 22 12"
                              stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <span class="brand-name">Waveline</span>
                    <span class="brand-desc">Local speech-to-text</span>
                </div>
            </div>
            <div class="header-right">
                <div id="connStatus" class="conn-badge">
                    <span class="dot"></span>
                    <span id="connText">Checking…</span>
                </div>
                <button id="themeToggle" class="btn-icon" title="Toggle theme" aria-label="Toggle theme">
                    <svg id="iconSun" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="12" cy="12" r="5"/>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                    <svg id="iconMoon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Record controls -->
        <div class="controls-card">

            <!-- Idle state: model picker + record button -->
            <div id="idleRow" class="idle-row">
                <select id="modelSelect" class="model-select" title="STT model">
                    <option value="whisper">Whisper</option>
                    <option value="voxtral">Voxtral</option>
                    <option value="vaani">Vaani (Hindi)</option>
                </select>
                <button id="startBtn" class="btn btn-record">
                    <span class="rec-circle"></span>
                    Record
                </button>
            </div>

            <!-- Recording state -->
            <div id="recordingRow" class="recording-row" style="display:none">
                <div class="rec-live">
                    <span class="rec-pulse"></span>
                    <span class="rec-label">Recording</span>
                    <div class="waveform" id="waveform">
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                </div>
                <button id="stopBtn" class="btn btn-stop">
                    <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
                    Stop
                </button>
            </div>

        </div>

        <!-- Status -->
        <p id="status" class="status-text"></p>

        <!-- Dead chunk warning -->
        <div id="deadWarning" class="dead-warning" style="display:none">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex-shrink:0">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            <span id="deadWarningText"></span>
        </div>

        <!-- Transcript -->
        <div class="transcript-section">
            <div class="section-header">
                <span class="section-label">Transcript</span>
                <span class="char-count" id="charCount">0 chars</span>
            </div>
            <textarea id="notes" placeholder="Transcript will appear here as you speak…" spellcheck="false"></textarea>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <button id="clearBtn" class="btn btn-ghost btn-sm">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M3 6h18M19 6l-1 14H6L5 6M10 11v6M14 11v6M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/>
                </svg>
                Clear
            </button>
            <button id="exportBtn" class="btn btn-ghost btn-sm">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                </svg>
                Export
            </button>
            <span class="hint">Continues in background</span>
        </div>

        <!-- Settings -->
        <details class="settings">
            <summary>
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
                </svg>
                Settings
            </summary>
            <div class="settings-body">
                <label for="serverUrl" class="field-label">Backend URL</label>
                <div class="url-row">
                    <input type="url" id="serverUrl" placeholder="http://localhost:8000" spellcheck="false" />
                    <button id="saveUrlBtn" class="btn btn-primary btn-sm">Save</button>
                </div>
                <p id="urlStatus" class="url-status"></p>

                <label for="languageInput" class="field-label">Whisper language</label>
                <input type="text" id="languageInput" placeholder="server default: hi"
                       spellcheck="false" maxlength="10"
                       style="padding:6px 9px;font-size:12px;font-family:var(--mono);background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);outline:none;width:100%;box-sizing:border-box;" />
                <p class="field-hint-text">Language code: <code>hi</code>, <code>en</code>, <code>zh</code>… or <code>auto</code> for detection. Empty = use server default.</p>

                <label for="transportSelect" class="field-label">Transport</label>
                <select id="transportSelect" class="model-select">
                    <option value="ws">WebSocket (low latency, auto-fallback to HTTP)</option>
                    <option value="http">HTTP only</option>
                </select>

                <label class="field-label toggle-row">
                    <span>Include microphone</span>
                    <input type="checkbox" id="micToggle" />
                </label>

                <label for="silenceThreshold" class="field-label">
                    Silence gate
                    <span id="silenceThresholdVal" class="field-hint">0.003</span>
                </label>
                <input type="range" id="silenceThreshold" min="0" max="0.02" step="0.001" value="0.003" />
                <p class="field-hint-text">Lower = transcribe quieter audio. Higher = skip more silence.</p>
            </div>
        </details>

    </div>
    <script src="popup.js"></script>
</body>
</html>
