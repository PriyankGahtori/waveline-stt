<!doctype html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Waveline</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="wrap">

        <!-- Header -->
        <header class="header">
            <div class="brand">
                <div class="brand-icon">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                        <path d="M2 12 Q5 4 8 12 Q11 20 14 12 Q17 4 20 12 Q21 16 22 12"
                              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    </svg>
                </div>
                <h1>Waveline</h1>
            </div>
            <div class="header-actions">
                <div id="connStatus" class="conn-badge">
                    <span class="dot"></span>
                    <span id="connText">Checking…</span>
                </div>
                <button id="themeToggle" class="btn-icon" title="Toggle theme" aria-label="Toggle theme">
                    <!-- Sun icon (shown in dark mode to switch to light) -->
                    <svg id="iconSun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="12" cy="12" r="5"/>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                    <!-- Moon icon (shown in light mode to switch to dark) -->
                    <svg id="iconMoon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
                <span id="recIndicator" class="rec-dot"></span>
            </div>
        </header>

        <!-- Controls card -->
        <div class="controls-card">
            <div class="controls-row">
                <button id="startBtn" class="btn btn-primary">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="12" r="6"/>
                    </svg>
                    Record
                </button>
                <button id="stopBtn" class="btn btn-danger" disabled>
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="5" y="5" width="14" height="14" rx="2"/>
                    </svg>
                    Stop
                </button>
            </div>
            <div class="options-row">
                <select id="modelSelect" class="model-select" title="STT Model">
                    <option value="whisper">Whisper</option>
                    <option value="voxtral">Voxtral</option>
                </select>
                <label class="toggle-mic">
                    <input type="checkbox" id="includeMic" />
                    <span class="toggle-track"></span>
                    <span class="toggle-label">Mic</span>
                </label>
            </div>
        </div>

        <!-- Status row -->
        <div class="status-row">
            <p id="status" class="status-text"></p>
            <div class="waveform" id="waveform">
                <span></span><span></span><span></span><span></span><span></span>
            </div>
        </div>

        <!-- Dead chunk warning -->
        <div id="deadWarning" class="dead-warning" style="display:none">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex-shrink:0;margin-top:1px">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            <span id="deadWarningText"></span>
        </div>

        <!-- Transcript -->
        <div class="transcript-section">
            <div class="section-header">
                <span class="section-label">Transcript</span>
                <span class="char-count" id="charCount">0 chars</span>
            </div>
            <textarea id="notes" placeholder="Your transcript will appear here…" spellcheck="false"></textarea>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <button id="clearBtn" class="btn btn-ghost btn-sm">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M3 6h18M19 6l-1 14H6L5 6M10 11v6M14 11v6M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/>
                </svg>
                Clear
            </button>
            <button id="exportBtn" class="btn btn-ghost btn-sm">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                </svg>
                Export
            </button>
        </div>

        <p class="hint">Recording continues when popup is closed.</p>

        <!-- Settings -->
        <details class="settings">
            <summary>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
                </svg>
                Settings
            </summary>
            <div class="settings-body">
                <label for="serverUrl" class="field-label">Backend URL</label>
                <div class="url-row">
                    <input type="url" id="serverUrl" placeholder="http://localhost:8000" spellcheck="false" />
                    <button id="saveUrlBtn" class="btn btn-primary btn-sm">Save</button>
                </div>
                <p id="urlStatus" class="url-status"></p>
            </div>
        </details>

    </div>
    <script src="popup.js"></script>
</body>
</html>
