<!doctype html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>Waveline — Recording</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
    .card {
      width: 340px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: var(--shadow);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .brand { display: flex; align-items: center; justify-content: center; gap: 9px; }
    .brand-icon {
      width: 30px; height: 30px;
      background: var(--accent-bg);
      border: 1px solid var(--accent-dim);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent);
    }
    h2 { font-size: 15px; font-weight: 600; color: var(--text); }
    .status-msg { font-size: 13px; color: var(--muted); line-height: 1.6; }
    .status-msg.ok    { color: var(--green); }
    .status-msg.error { color: var(--red); }
    .waveform { display: flex; align-items: center; justify-content: center; gap: 4px; height: 24px; opacity: 0; transition: opacity 0.3s; }
    .waveform.active { opacity: 1; }
    .waveform span { display: block; width: 4px; background: var(--accent); border-radius: 2px; height: 5px; animation: wave 1s ease-in-out infinite; }
    .waveform span:nth-child(1) { animation-delay: 0s; }
    .waveform span:nth-child(2) { animation-delay: 0.15s; }
    .waveform span:nth-child(3) { animation-delay: 0.3s; }
    .waveform span:nth-child(4) { animation-delay: 0.15s; }
    .waveform span:nth-child(5) { animation-delay: 0s; }
    @keyframes wave { 0%,100% { height: 5px; } 50% { height: 18px; } }
    .hint { font-size: 11px; color: var(--border-2); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-icon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
          <path d="M2 12 Q5 4 8 12 Q11 20 14 12 Q17 4 20 12 Q21 16 22 12"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2>Waveline</h2>
    </div>
    <div class="waveform" id="waveform">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <p class="status-msg" id="status">Initialising…</p>
    <p class="hint">This tab is recording. You can switch to another tab — recording continues in the background.</p>
  </div>
  <script src="recording.js"></script>
</body>
</html>
